<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERIDEX — Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C10;--s1:#11141A;--s2:#181C24;--line:#242A35;--tx:#E8ECF2;--mu:#8B95A5;--pr:#4C8DFF;--ok:#4CB782;--warn:#E0A94A;
--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
aside.sb{background:var(--s1);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:13px;padding:0 8px 22px}
.mark{width:20px;height:20px;border:2px solid var(--pr);border-radius:5px;position:relative;flex:none}
.mark:after{content:"";position:absolute;left:4px;top:2px;width:5px;height:9px;border:solid var(--pr);border-width:0 2px 2px 0;transform:rotate(40deg)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--mu);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a i{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;flex:none;opacity:.8}
.nav a.on{background:#4C8DFF18;color:var(--tx)}.nav a.on i{border-color:var(--pr)}
.ws{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.ws div{display:flex;align-items:center;gap:10px;padding:6px 8px}
.av{width:28px;height:28px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--sans);flex:none}
.ws small{display:block;color:var(--mu);font-size:11.5px}
main{padding:28px 36px 48px;min-width:0;max-width:1100px}
h1{margin:0 0 18px;font-size:24px;letter-spacing:-.02em;font-weight:650}
.lay{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.sn a{display:block;padding:8px 12px;border-radius:6px;color:var(--mu);text-decoration:none;font-weight:500;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent}
.sn a.on{background:var(--s1);color:var(--tx);border-left-color:var(--pr)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.cap{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.sec h2{margin:0 0 2px;font-size:18px}
.sec>p{margin:0 0 16px;color:var(--mu)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row b{display:block;font-weight:600}
.row small{color:var(--mu);font-size:12.5px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 12px;color:var(--tx);font:13px var(--sans)}
.inp:focus{outline:1px solid var(--pr);border-color:var(--pr)}
.ro{font:12.5px var(--mono);color:var(--mu);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 12px;overflow-wrap:anywhere}
.tg{width:36px;height:20px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;justify-self:end}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--mu);transition:.15s}
.tg.on{background:var(--pr)}.tg.on:after{left:19px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;justify-self:end}
.seg button{background:none;border:0;color:var(--mu);padding:5px 12px;font:500 12.5px var(--sans);cursor:pointer}
.seg button.on{background:var(--s2);color:var(--tx)}
.seg button:disabled{opacity:.45;cursor:default}
.tag{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mu);margin-left:8px;vertical-align:middle}
.tag.ok{color:var(--ok);border-color:#2A5C44;background:#4CB78214}
.plan{opacity:.6}
.plan .row{grid-template-columns:1fr auto}
.gap{margin-top:18px}
.info{padding:10px 14px;border-left:3px solid var(--line);color:var(--mu);font-size:12.5px;margin-top:14px}
.bar{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.btn{display:inline-flex;padding:8px 14px;border-radius:7px;font:600 13px var(--sans);border:1px solid var(--line);color:var(--tx);background:transparent;cursor:pointer}
.btn.p{background:var(--pr);border-color:var(--pr);color:#06101F}
.saved{color:var(--ok);font-size:12.5px;opacity:0;transition:opacity .2s}
.note{color:var(--mu);font-size:11.5px;margin-top:20px}
@media (max-width:1180px){.app{grid-template-columns:60px minmax(0,1fr)}.nav a span,.logo span,.ws small,.ws b{display:none}.nav a{justify-content:center}.logo{justify-content:center;padding-inline:0}main{padding:24px 20px}}
@media (max-width:820px){.lay{grid-template-columns:1fr;gap:14px}.sn{display:flex;gap:6px;overflow-x:auto}.sn a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.sn a.on{border-bottom-color:var(--pr)}.row{grid-template-columns:1fr;gap:8px}.tg,.seg{justify-self:start}}
</style></head><body>
<div class="app">
<aside class="sb">
<div class="logo"><div class="mark"></div><span>VERIDEX</span></div>
<div class="nav"><a href="#"><i></i><span>Overview</span></a><a href="#"><i></i><span>Investigations</span></a><a href="#"><i></i><span>Data Sources</span></a><a href="#"><i></i><span>Evidence</span></a><a href="#"><i></i><span>Decisions</span></a><a href="#"><i></i><span>History</span></a><a class="on" href="#"><i></i><span>Settings</span></a></div>
<div class="ws"><div><span class="av">AC</span><span><b>Acme Retail</b><small>Workspace</small></span></div><div><span class="av">G</span><span><b>Gagandeep</b><small>Analyst</small></span></div></div>
</aside>
<main>
<h1>Settings</h1>
<div class="lay">
<nav class="sn" id="sn"><a class="on" data-s="ws">Workspace</a><a data-s="model">Model configuration</a><a data-s="src">Data sources</a><a data-s="sec">Security</a><a data-s="pref">Preferences</a></nav>
<div class="sec" id="c"></div>
</div>
<p class="note">Sample values shown for illustration.</p>
</main></div>
<script>
const tg=(k,on)=>`<button class="tg ${on?'on':''}" data-k="${k}" aria-pressed="${on}"></button>`;
const P={tech:false,panel:true,dens:"Comfortable"};
const V={
ws:()=>`<h2>Workspace</h2><p>Basic details for this workspace.</p>
<div class="card"><div class="row"><div><b>Workspace name</b><small>Shown in the sidebar</small></div><input class="inp" value="Acme Retail"></div>
<div class="row"><div><b>Workspace ID</b><small>Read-only</small></div><div class="ro">ws_7f3a91c2</div></div></div>

<div class="bar"><span class="saved" id="sv">Saved</span><button class="btn">Cancel</button><button class="btn p" id="save">Save changes</button></div>`,
model:()=>`<h2>Model configuration</h2><p>How VERIDEX runs an investigation.</p>
<div class="card"><div class="row"><div><b>Model</b><small>Used for reasoning and answers</small></div><div class="ro">Configured on the server</div></div>
</div>
<div class="info">These values come from the backend configuration. This page shows them but does not change them unless the backend exposes editable settings.</div>`,
src:()=>`<h2>Data sources</h2><p>Manage connected data in one place.</p>
<div class="card"><div class="row"><div><b>Connected sources</b><small>1 database, 1 CSV file, 1 Excel workbook</small></div><div style="justify-self:end"><button class="btn">Open Data Sources →</button></div></div>
<div class="row"><div><b>Default source for new questions</b><small>Used when a question does not name a source</small></div><div class="ro">Operations database</div></div></div>`,
sec:()=>`<h2>Security</h2><p>What protects your data and answers today.</p>
<div class="card"><div class="row"><div><b>Read-only SQL</b><small>VERIDEX cannot modify your data</small></div><div><span class="tag ok" style="margin:0">✓ Enforced</span></div></div>
<div class="row"><div><b>Evidence tracing</b><small>Every claim links to its evidence</small></div><div><span class="tag ok" style="margin:0">✓ Enabled</span></div></div>
<div class="row"><div><b>Deterministic calculations</b><small>Totals, margins and rankings are computed by code</small></div><div><span class="tag ok" style="margin:0">✓ Enabled</span></div></div>
<div class="row"><div><b>Investigation limit</b><small>Maximum turns per question</small></div><div class="ro">5 turns</div></div></div>`,
pref:()=>`<h2>Preferences</h2><p>Personal display settings. Saved in this browser.</p>
<div class="card"><div class="row"><div><b>Theme</b><small>Appearance of the app</small></div><div class="seg"><button class="on">Dark</button><button disabled title="Not available yet">Light</button></div></div>
<div class="row"><div><b>Density</b><small>Spacing in tables and lists</small></div><div class="seg" id="dn">${["Comfortable","Compact"].map(d=>`<button class="${P.dens===d?'on':''}">${d}</button>`).join('')}</div></div>
<div class="row"><div><b>Show technical details by default</b><small>Expand SQL and tool calls on investigation pages</small></div>${tg('tech',P.tech)}</div>
<div class="row"><div><b>Open evidence panel automatically</b><small>Show evidence beside the answer on the Ask page</small></div>${tg('panel',P.panel)}</div></div>`};
let cur="ws";
function show(s){cur=s;document.getElementById('c').innerHTML=V[s]();
document.querySelectorAll('#sn a').forEach(a=>a.classList.toggle('on',a.dataset.s===s));
document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{P[b.dataset.k]=!P[b.dataset.k];b.classList.toggle('on');b.setAttribute('aria-pressed',P[b.dataset.k])});
document.querySelectorAll('#dn button').forEach(b=>b.onclick=()=>{P.dens=b.textContent;document.querySelectorAll('#dn button').forEach(x=>x.classList.toggle('on',x===b))});
const sv=document.getElementById('save');if(sv)sv.onclick=()=>{const m=document.getElementById('sv');m.style.opacity=1;setTimeout(()=>m.style.opacity=0,1600)}}
document.querySelectorAll('#sn a').forEach(a=>a.onclick=()=>show(a.dataset.s));
show("ws");
</script><style>.b-pr{color:#4C8DFF;border-color:#2B4A7A;background:#4C8DFF14}.links span:hover{color:#E8ECF2}
.appr{padding:16px 18px;border-left:3px solid var(--ap,#4C8DFF)}.appr .ah{display:flex;justify-content:space-between;align-items:center;gap:10px}
.appr p{margin:8px 0 12px;color:#C6CEDA;font-size:13.5px}.appr .ab{display:flex;gap:8px;flex-wrap:wrap}
.apbtn{background:none;border:1px solid #242A35;color:#E8ECF2;border-radius:7px;padding:7px 14px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}.apbtn:hover{border-color:#3A4658}.apbtn.pr{background:#4C8DFF;border-color:#4C8DFF;color:#06101F}</style>
<script>(function(){var go=function(k){parent.postMessage({veridex:k},'*')};
var NAV={'Overview':'overview','Investigations':'ask','Data Sources':'sources','Evidence':'evidence','Decisions':'decision','History':'history','Settings':'settings'};
var RULES=[{"r": "Open Data Sources", "to": "sources"}, {"s": ".logo", "to": "overview"}];
var B={pending:'<span class="badge b-pr">Pending review</span>',approved:'<span class="badge b-ok">Approved</span>',rejected:'<span class="badge b-neu">Rejected</span>'};
window.VXS={approval:'pending',at:''};
function paint(){var S=window.VXS,a=S.approval;
document.querySelectorAll('[data-apbadge]').forEach(function(el){el.innerHTML=B[a]});
document.querySelectorAll('[data-appr]').forEach(function(el){
el.style.setProperty('--ap',a==='approved'?'#4CB782':a==='rejected'?'#8B95A5':'#4C8DFF');
el.innerHTML=a==='pending'?'<div class="ah"><span class="cap">Human approval</span>'+B.pending+'</div><p><b>Prioritize North region</b><br>Review the evidence, then approve or reject. VERIDEX recommends; you decide.</p><div class="ab"><button class="apbtn" data-a="ev">Review evidence</button><button class="apbtn" data-a="rej">Reject</button><button class="apbtn pr" data-a="ok">Approve</button></div>'
:'<div class="ah"><span class="cap">Human approval</span>'+B[a]+'</div><p><b>'+(a==='approved'?'Approved':'Rejected')+'</b> by Gagandeep · '+S.at+'<br>Recorded with 7 evidence items and a Stable robustness check.</p><div class="ab"><button class="apbtn" data-a="undo">Undo</button></div>'})}
window.addEventListener('message',function(e){if(e.data&&e.data.vxState){window.VXS=e.data.vxState;paint();document.dispatchEvent(new Event('vxstate'))}});
var AT='Sep 30, 14:31';
document.addEventListener('click',function(e){var b=e.target.closest('.apbtn[data-a]');if(!b)return;var a=b.dataset.a;
if(a==='ev'){if(typeof show==='function'&&document.getElementById('panel'))show('E-01');else go('evidence')}
else parent.postMessage({vxSet:{approval:a==='ok'?'approved':a==='rej'?'rejected':'pending',at:AT}},'*')});
document.addEventListener('click',function(e){
if(e.target.closest('.apbtn'))return;
var n=e.target.closest('.nav a');if(n){e.preventDefault();var k=NAV[n.textContent.trim()];if(k)go(k);return}
for(var i=0;i<RULES.length;i++){var u=RULES[i],el=e.target.closest(u.s||'a,button');if(!el)continue;
if(u.r&&!new RegExp(u.r).test((el.textContent||'').trim()))continue;
e.preventDefault();e.stopPropagation();go(u.to);return}
var a=e.target.closest('a');if(a&&a.getAttribute('href')==='#')e.preventDefault()},true);
paint()})();</script></body></html>
